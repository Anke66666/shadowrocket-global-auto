name: Safe upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 10:00 Beijing, possible GitHub scheduling delays
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'upstream/**'
      - 'global-auto.conf'
      - 'UPSTREAM.json'

permissions:
  contents: write

concurrency:
  group: global-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate Johnshall config and Gemini rules
        run: python scripts/build.py
      - name: Test generated config and Gemini snapshot
        run: python -m unittest discover -s tests -v
      - name: Commit changes only when all validation succeeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-auto.conf UPSTREAM.json upstream/Gemini_2026_Shadowrocket.list
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync validated Shadowrocket config and Gemini rules'
          git push

